# Git hooks, run by `prek` (https://prek.j178.dev).
#:schema https://www.schemastore.org/prek.json
#
#     prek install
#
# Split by latency: anything that only reads files runs on `pre-commit`, so
# committing stays quick. Anything that compiles runs on `pre-push`, where the
# wait is expected and the alternative is finding out from CI.

default_install_hook_types = ["pre-commit", "pre-push", "commit-msg"]

# Bundled with prek itself, so there is no repository to clone and no Python to
# install: a fresh checkout can run these offline.
[[repos]]
repo = "builtin"
hooks = [
  # Whitespace carries meaning in the vendored vectors — a trailing space is
  # what several of them are testing — so the three that rewrite it stop short
  # of `fixtures`.
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"], exclude = '^fixtures/' },
  { id = "end-of-file-fixer", exclude = '^fixtures/' },
  # .gitattributes pins the working tree to LF; this catches a file that
  # slipped in before it applied.
  { id = "mixed-line-ending", args = ["--fix=lf"], exclude = '^fixtures/' },
  { id = "check-merge-conflict" },
  { id = "check-case-conflict" },
  # Windows is not a target, but the source tree still has to check out on one.
  # Held to the commit stage: at the message stage it is handed the path to
  # COMMIT_EDITMSG, which from a linked worktree is a `..` walk it refuses.
  { id = "check-illegal-windows-names", stages = ["pre-commit"] },
  { id = "check-added-large-files" },
  { id = "check-toml" },
  { id = "check-yaml" },
]

# Neither builtin nor `system`: prek installs a pinned binary, so nothing has
# to be on PATH. Upstream's `--write-changes` is dropped — a spell checker
# editing prose unasked is worse than one that names the line. Config, and what
# it excludes, in `typos.toml`.
[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.51.1"
hooks = [{ id = "typos", args = ["--force-exclude"] }]

# Scoped to Rust files so touching only docs needs no toolchain, and the
# compiler counts as one: a release arrives with new lints and a rustfmt that
# moves code. The pre-push set is what CI runs, so a red push costs no CI
# round trip.
[[repos]]
repo = "local"
hooks = [
  # Formats in place and fails if anything moved, so the fix is `git add`.
  { id = "cargo-fmt", name = "cargo fmt", entry = "cargo fmt --all", language = "system", files = '\.rs$|(^|/)rust-toolchain\.toml$', pass_filenames = false, require_serial = true },
  { id = "cargo-clippy", name = "cargo clippy", entry = "cargo clippy --all-targets -- -D warnings", language = "system", files = '\.rs$|(^|/)Cargo\.(toml|lock)$|(^|/)rust-toolchain\.toml$', pass_filenames = false, require_serial = true },
  { id = "cargo-test", name = "cargo test", entry = "cargo test --all-targets", language = "system", files = '\.rs$|(^|/)Cargo\.(toml|lock)$|\.md$|(^|/)rust-toolchain\.toml$', pass_filenames = false, require_serial = true, stages = ["pre-push"] },
  # The floor is read from Cargo.toml so `rust-version` is the only place it
  # lives, and asked for with `+` because `rust-toolchain.toml` beats a default.
  { id = "cargo-msrv", name = "cargo check (MSRV)", entry = "sh -c 'cargo +$(grep ^rust-version Cargo.toml | tr -dc 0-9.) check'", language = "system", files = '\.rs$|(^|/)Cargo\.(toml|lock)$|(^|/)rust-toolchain\.toml$', pass_filenames = false, require_serial = true, stages = ["pre-push"] },
]

# Unscoped, alone among these: an advisory is published against a lockfile
# nobody has edited, so a `files` pattern would hold this back exactly when it
# has something to say. The 1.5s is mostly the advisory fetch, a reach for
# GitHub of its own, so a push with no network fails here rather than later.
[[repos]]
repo = "local"
hooks = [
  { id = "deny", name = "supply chain (just deny)", entry = "just deny", language = "system", always_run = true, pass_filenames = false, require_serial = true, stages = ["pre-push"] },
]

# The sign-off CONTRIBUTING asks for. Git has no `commit.signOff`, so an
# unenforced convention is the only alternative. Merge commits are exempt, as
# DCO checks conventionally are — they carry no new work to certify.
[[repos]]
repo = "local"
hooks = [
  { id = "dco", name = "sign-off (git commit -s)", entry = "grep -qE '^(Signed-off-by: |Merge )'", language = "system", stages = ["commit-msg"] },
]
