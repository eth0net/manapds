[package]
name = "manapds"
version = "0.1.0"
edition = "2024"
# Pinned rather than tracking stable so a contributor on an older toolchain
# gets a clear error instead of a confusing one. Raise it deliberately.
rust-version = "1.98"
license = "MIT OR Apache-2.0"
authors = ["eth0net <eth0net@pm.me>"]
description = "A minimal atproto Personal Data Server, on SQLite."
repository = "https://github.com/eth0net/manapds"
# A name on crates.io cannot be given back and a version cannot be withdrawn,
# so nothing publishes until something here is worth depending on.
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "tracing"] }
base64 = { version = "0.23", default-features = false, features = ["std"] }
bs58 = "0.5.1"
bytes = "1.12.1"
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
hmac = "0.13"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", default-features = false, features = ["client", "http1"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "ring", "webpki-roots"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["client-legacy", "http1", "tokio"] }
ipld-core = { version = "0.4.3", features = ["serde"] }
jiff = { version = "0.2.37", default-features = false, features = ["std"] }
k256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"] }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"] }
rand = "0.10.2"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
scrypt = { version = "0.12.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_ipld_dagcbor = "0.7.0"
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.7", features = ["cors", "normalize-path", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unsigned-varint = "0.8.0"

[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
hex = "0.4.3"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7", features = ["normalize-path"] }
