[package]
name = "manapds"
version = "0.1.0"
edition = "2024"
# Pinned rather than tracking stable so a contributor on an older toolchain
# gets a clear error instead of a confusing one. Raise it deliberately.
rust-version = "1.98"
license = "MIT OR Apache-2.0"
authors = ["eth0net <eth0net@pm.me>"]
description = "A minimal atproto Personal Data Server, on SQLite."
repository = "https://github.com/eth0net/manapds"
# A name on crates.io cannot be given back and a version cannot be withdrawn,
# so nothing publishes until something here is worth depending on.
publish = false

[dependencies]
axum = "0.8.9"
bs58 = "0.5.1"
k256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"] }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"] }
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6.11", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
base64 = "0.23.1"
hex = "0.4.3"
