# `.github/dependabot.yml`. Dependabot reads only this spelling, so it is the
# one place `.yml` beats the `.yaml` the rest of the repo uses.
version: 2
updates:
  # Grouped under one pattern so a week's bumps arrive as a single PR.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
