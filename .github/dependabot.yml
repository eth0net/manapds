# `.github/dependabot.yml`. Dependabot reads only this spelling, so it is the
# one place `.yml` beats the `.yaml` the rest of the repo uses.
version: 2
updates:
  # Grouped under one pattern so a week's bumps arrive as a single PR.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # This action publishes a branch per version number rather than tags, so
      # Dependabot reads `1.120` as newer than `1.98` and proposes a toolchain
      # that does not exist. The pin tracks `rust-version` in Cargo.toml and
      # moves with it, in the same commit.
      - dependency-name: dtolnay/rust-toolchain
