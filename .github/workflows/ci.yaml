name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # No Windows: an account's files sit under its DID, and a DID has
        # colons in it, which Windows will not have in a path.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      # No toolchain action: `rust-toolchain.toml` names the compiler, and
      # one that installed `stable` here would be overridden by it anyway.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --all-targets

  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Read from Cargo.toml so rust-version is the only place the floor lives.
      - id: msrv
        run: >-
          sed -n 's/^rust-version = "\(.*\)"/version=\1/p' Cargo.toml
          >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # `+` rather than the default the action set: `rust-toolchain.toml`
      # beats that, and the floor would go unchecked without a word.
      - run: cargo +${{ steps.msrv.outputs.version }} check --locked

  typos:
    name: spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Reads typos.toml, so the repo's `locale` applies here too.
      - uses: crate-ci/typos@v1.51.1

  deny:
    uses: ./.github/workflows/advisories.yaml
